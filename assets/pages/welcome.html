<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome · Student Result Portal</title>

<!-- Bootstrap 5 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/shared.css">
<link rel="stylesheet" href="/assets/css/welcome.css">
</head>
<body>

<!-- ===== Top Navbar ===== -->
<header class="app-navbar">
  <div class="app-navbar-inner">

    <a href="/welcome.html" class="brand-lockup">
      <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
      <span class="brand-name">Edutech</span>
    </a>

    <!-- data-page identifies each link; JS/CSS use it to mark the active
         one on pages where a nav item genuinely represents "you are here".
         This welcome page isn't any of these, so none carry .active. -->
    <nav class="app-nav-links" id="appNavLinks">
      <a href="/pages/dashboard.html" class="nav-link" data-page="dashboard">Dashboard</a>
      <a href="/pages/results.html" class="nav-link" data-page="results">Results</a>
      <a href="/pages/courses.html" class="nav-link" data-page="courses">Courses</a>
      <a href="/pages/transcript.html" class="nav-link" data-page="transcript">Transcript</a>
      <a href="/pages/profile.html" class="nav-link" data-page="profile">Profile</a>
    </nav>

    <div class="app-navbar-right">

      <div class="app-navbar-profile dropdown">
        <button class="profile-avatar-btn" id="profileMenuBtn" type="button"
                data-bs-toggle="dropdown" aria-expanded="false">
          <img src="" alt="" id="profileAvatarImg" class="profile-avatar-img d-none">
          <span id="profileAvatarInitials" class="profile-avatar-initials"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileMenuBtn">
          <li><a class="dropdown-item" href="/pages/profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
        </ul>
      </div>

      <button class="nav-toggle-btn" id="navToggleBtn" type="button"
              aria-expanded="false" aria-controls="mobileNavPanel" aria-label="Open menu">
        <i class="bi bi-list"></i>
      </button>

    </div>

  </div>
</header>

<!-- ===== Mobile nav panel (slides in from the right, covers viewport) ===== -->
<div class="mobile-nav-scrim" id="mobileNavScrim"></div>
<nav class="mobile-nav-panel" id="mobileNavPanel" aria-label="Mobile navigation">
  <div class="mobile-nav-header">
    <span class="brand-name">Menu</span>
    <button class="nav-toggle-btn" id="navCloseBtn" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <a href="/pages/dashboard.html" class="mobile-nav-link" data-page="dashboard">
    <i class="bi bi-grid"></i> Dashboard
  </a>
  <a href="/pages/results.html" class="mobile-nav-link" data-page="results">
    <i class="bi bi-clipboard-data"></i> Results
  </a>
  <a href="/pages/courses.html" class="mobile-nav-link" data-page="courses">
    <i class="bi bi-journal-bookmark"></i> Courses
  </a>
  <a href="/pages/transcript.html" class="mobile-nav-link" data-page="transcript">
    <i class="bi bi-file-earmark-text"></i> Transcript
  </a>
  <a href="/pages/profile.html" class="mobile-nav-link" data-page="profile">
    <i class="bi bi-person"></i> Profile
  </a>
</nav>

<!-- ===== Welcome Hero ===== -->
<main class="welcome-hero">
  <div class="welcome-hero-overlay"></div>

  <div class="welcome-hero-inner">
    <div class="welcome-copy">
      <h1>Welcome Back, <span id="welcomeName">Student</span> <span class="wave">👋</span></h1>
      <p>Track your academic progress and manage your results.</p>
      <a href="/assets/pages/dashboard.html" class="btn btn-brand" id="viewDashboardBtn">
        View Dashboard
      </a>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/welcome.js"></script>
</body>
</html>
