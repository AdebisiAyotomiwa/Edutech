<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome · Student Result Portal</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/css/shared.css" />
    <link rel="stylesheet" href="/assets/css/welcome.css" />
  </head>
  <body>
    <!-- ===== Top Navbar (desktop) ===== -->
    <header class="app-navbar">
      <div class="app-navbar-inner">
        <a href="/welcome.html" class="brand-lockup">
          <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
          <span class="brand-name">Edutech</span>
        </a>

        <nav class="app-nav-links">
          <a
            href="/assets/pages/dashboard.html"
            class="nav-link"
            data-page="dashboard"
            >Dashboard</a
          >
          <a
            href="/assets/pages/results.html"
            class="nav-link"
            data-page="results"
            >Results</a
          >
          <a
            href="/assets/pages/courses.html"
            class="nav-link"
            data-page="courses"
            >Courses</a
          >
          <a
            href="/assets/pages/transcript.html"
            class="nav-link"
            data-page="transcript"
            >Transcript</a
          >
          <a
            href="/assets/pages/profile.html"
            class="nav-link"
            data-page="profile"
            >Profile</a
          >
        </nav>

        <div class="app-navbar-right">
          <div class="app-navbar-profile dropdown">
            <button
              class="profile-avatar-btn"
              id="profileMenuBtn"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <img
                src=""
                alt=""
                id="profileAvatarImg"
                class="profile-avatar-img d-none"
              />
              <span
                id="profileAvatarInitials"
                class="profile-avatar-initials"
              ></span>
            </button>
            <ul
              class="dropdown-menu dropdown-menu-end"
              aria-labelledby="profileMenuBtn"
            >
              <li>
                <a class="dropdown-item" href="/assets/pages/profile.html"
                  ><i class="bi bi-person me-2"></i>My Profile</a
                >
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <button class="dropdown-item text-danger" id="logoutBtn">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>

          <!-- Same toggle button + same is-open pattern as the dashboard sidebar -->
          <button
            class="app-sidebar-toggle"
            id="sidebarToggleBtn"
            type="button"
            aria-expanded="false"
            aria-label="Open menu"
          >
            <i class="bi bi-list"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- ===== Mobile sidebar drawer — IDENTICAL markup/classes to the
     dashboard's .app-sidebar, so it looks and behaves exactly the same
     on small screens: same dark green panel, slides from the left,
     same scrim, same JS toggle pattern. ===== -->
    <aside class="app-sidebar app-sidebar--drawer-only" id="appSidebar">
      <a href="/welcome.html" class="brand-lockup">
        <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
        <span class="brand-name">Edutech</span>
      </a>

      <nav class="app-sidebar-nav">
        <a
          href="/assets/pages/dashboard.html"
          class="app-sidebar-link"
          data-page="dashboard"
        >
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a
          href="/assets/pages/results.html"
          class="app-sidebar-link"
          data-page="results"
        >
          <i class="bi bi-bar-chart-fill"></i> Results
        </a>
        <a
          href="/assets/pages/courses.html"
          class="app-sidebar-link"
          data-page="courses"
        >
          <i class="bi bi-bookmark-fill"></i> Courses
        </a>
        <a
          href="/assets/pages/transcript.html"
          class="app-sidebar-link"
          data-page="transcript"
        >
          <i class="bi bi-file-earmark-text-fill"></i> Transcript
        </a>
        <a
          href="/assets/pages/profile.html"
          class="app-sidebar-link"
          data-page="profile"
        >
          <i class="bi bi-person-fill"></i> Profile
        </a>
      </nav>

      <div class="app-sidebar-footer">
        <button class="app-sidebar-logout" id="mobileSidebarLogoutBtn">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </aside>

    <div class="app-sidebar-scrim" id="appSidebarScrim"></div>

    <!-- ===== Welcome Hero ===== -->
    <main class="welcome-hero">
      <div class="welcome-hero-overlay"></div>

      <div class="welcome-hero-inner welcome-hero-inner--split">
        <div class="welcome-copy">
          <h1>
            Welcome Back, <span id="welcomeName">Student</span>
            <span class="wave">👋</span>
          </h1>
          <p>Track your academic progress and manage your results.</p>
          <a
            href="/assets/pages/dashboard.html"
            class="btn btn-brand"
            id="viewDashboardBtn"
          >
            View Dashboard
          </a>
        </div>

        <div class="welcome-notifications-card">
          <div class="welcome-notifications-header">
            <i class="bi bi-bell-fill"></i>
            <span>Notifications</span>
          </div>
          <div class="welcome-notifications-body" id="notificationsBody">
            <p class="welcome-notifications-empty">
              No important information at this time.
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/welcome.js"></script>
  </body>
</html>
