<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile · Lecturer · Edutech</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/shared.css" />
  <link rel="stylesheet" href="/assets/css/dashboard.css" />
  <link rel="stylesheet" href="/assets/css/lecturer.css" />
</head>
<body class="app-shell">

  <!-- ═══════════════════════ SIDEBAR ═══════════════════════ -->
  <aside class="app-sidebar app-sidebar--lecturer" id="appSidebar">
    <a href="/assets/pages/lecturer/lecturer-dashboard.html" class="brand-lockup">
      <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
      <span class="brand-name">Edutech <span class="lecturer-role-tag">Lecturer</span></span>
    </a>
    <span class="sidebar-section-label">Menu</span>
    <nav class="app-sidebar-nav">
      <a href="/assets/pages/lecturer/lecturer-dashboard.html" class="app-sidebar-link">
        <i class="bi bi-grid-1x2-fill"></i> Dashboard
      </a>
      <a href="/assets/pages/lecturer/lecturer-courses.html" class="app-sidebar-link">
        <i class="bi bi-bookmark-fill"></i> My Courses
      </a>
      <a href="/assets/pages/lecturer/lecturer-upload.html" class="app-sidebar-link">
        <i class="bi bi-cloud-upload-fill"></i> Upload Results
      </a>
      <a href="/assets/pages/lecturer/lecturer-history.html" class="app-sidebar-link">
        <i class="bi bi-clock-history"></i> Submission History
      </a>
      <a href="/assets/pages/lecturer/lecturer-profile.html" class="app-sidebar-link active">
        <i class="bi bi-person-fill"></i> My Profile
      </a>
    </nav>
    <div class="app-sidebar-footer">
      <div class="app-sidebar-user">
        <span class="app-sidebar-user-avatar"><span id="sidebarAvatarInitials"></span></span>
        <div class="app-sidebar-user-info">
          <div class="app-sidebar-user-name" id="sidebarUserName">&nbsp;</div>
          <div class="app-sidebar-user-meta" id="sidebarUserMeta">&nbsp;</div>
        </div>
      </div>
      <button class="app-sidebar-logout" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </aside>
  <div class="app-sidebar-scrim" id="appSidebarScrim"></div>

  <!-- ═══════════════════════ MAIN ═══════════════════════ -->
  <div class="app-main">
    <header class="app-topbar">
      <button class="app-sidebar-toggle" id="sidebarToggleBtn" aria-label="Open menu" aria-expanded="false">
        <i class="bi bi-list"></i>
      </button>
      <span class="app-topbar-title">My Profile</span>
    </header>

    <div class="app-content">
      <div class="dashboard-state" id="pageLoading">
        <div class="spinner-border text-success mb-3" style="width:2rem;height:2rem;" role="status"></div>
        <div>Loading profile…</div>
      </div>

      <div id="pageContent" class="d-none">

        <!-- Profile card -->
        <div class="dashboard-panels" style="max-width:860px;">

        <!-- Identity card -->
          <div class="panel" style="max-width:560px;">
            <div class="panel-header">
              <h2 class="panel-title">Personal Information</h2>
              <span class="status-badge status-badge--info" style="font-size:.72rem;">Read-only</span>
            </div>
            <div class="panel-body">
              <!-- Avatar + name -->
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="student-avatar-lg" id="profileAvatar" style="width:64px;height:64px;font-size:1.4rem;"></div>
                <div>
                  <div class="fw-bold" style="font-size:1.15rem;font-family:var(--font-display);" id="profileFullName">—</div>
                  <div class="text-muted small" id="profileStaffId">—</div>
                </div>
              </div>

              <div class="row g-3" id="profileFields">
                <!-- filled by JS -->
              </div>
            </div>
          </div>

        </div>
      </div><!-- /pageContent -->
    </div>
  </div>

  <!-- Logout modal -->
  <div class="modal fade" id="logoutConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4">
          <i class="bi bi-box-arrow-right fs-1 text-danger mb-3 d-block"></i>
          <h5 class="fw-semibold mb-2">Log out?</h5>
          <p class="text-muted mb-4">Are you sure you want to log out of your account?</p>
          <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-secondary-outline" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger-soft" id="confirmLogoutBtn">Yes, log out</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/assets/js/lecturer/lecturer-profile.js"></script>
</body>
</html>
